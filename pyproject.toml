[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "march"
version = "0.0.2"
description = "Marching Cubes algorithm implementation for extracting meshes from scalar fields using PyTorch"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Do Hoang Khoi", email = "khoido8899@gmail.com"}
]
requires-python = ">=3.10"
keywords = ["marching-cubes", "mesh-extraction", "pytorch", "3d-graphics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Graphics :: 3D",
]
dependencies = []

[project.optional-dependencies]
cuda = [
    "nvidia-cuda-toolkit==12.8.2",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/KhoiDOO/march"
Repository = "https://github.com/KhoiDOO/march.git"
Documentation = "https://github.com/KhoiDOO/march#readme"
Issues = "https://github.com/KhoiDOO/march/issues"

[tool.setuptools]
packages = ["march", "march.pyt"]

[tool.setuptools.package-data]
march = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
